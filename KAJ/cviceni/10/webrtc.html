
<!DOCTYPE html>
<html>
	<head>
		<title>Webrtc</title>
	</head>
	<style media="screen">
		canvas {
			border: 3px groove black;
			box-shadow: 2px 2px 3px #a0a0a0;
			cursor: crosshair;
			background: url(space.jpg) no-repeat 0 0;
		}
	</style>
	<body>
		<canvas width="800" height="400"></canvas>
		<div id="error" style="display:none; color:red; font-weight:bold; margin:10px;"></div>
		<script type="text/javascript">
			const canvas = document.querySelector('canvas');
			const ctx = canvas.getContext('2d');
			const WIDTH = canvas.offsetWidth;
			const HEIGHT = canvas.offsetHeight;
			const VIDEO_X = 200;
			const VIDEO_Y = 70;
			const VIDEO_W = 320;
			const VIDEO_H = 240;

			const video = document.createElement('video');
			video.setAttribute('playsinline', '');

			const showError = (msg) => {
				const el = document.getElementById('error');
				el.textContent = msg;
				el.style.display = 'block';
			};

			const initCamera = async () => {
				try {
					const stream = await navigator.mediaDevices.getUserMedia({ video: true });
					video.srcObject = stream;
					video.onloadedmetadata = () => {
						video.play();
						requestAnimationFrame(draw);
					};
				} catch (err) {
					console.error(err);
					switch (err.name) {
						case 'NotAllowedError':
							showError('Přístup ke kameře byl zamítnut. Povolte kameru v nastavení prohlížeče i systému (System Settings → Privacy & Security → Camera).');
							break;
						case 'NotFoundError':
							showError('Nebyla nalezena žádná kamera.');
							break;
						case 'NotReadableError':
							showError('Kamera je používána jinou aplikací.');
							break;
						default:
							showError(`Chyba kamery: ${err.name} — ${err.message}`);
					}
				}
			};

			initCamera();

			const drawVideo = () => {
				ctx.drawImage(video, VIDEO_X, VIDEO_Y, VIDEO_W, VIDEO_H);
				chromaKey();
			};

			const chromaKey = () => {
				const keyColor = [201, 201, 129];
				const imageData = ctx.getImageData(VIDEO_X, VIDEO_Y, VIDEO_W, VIDEO_H);
				const data = imageData.data;

				for (let i = 0; i < data.length; i += 4) {
					const dr = data[i] - keyColor[0];
					const dg = data[i + 1] - keyColor[1];
					const db = data[i + 2] - keyColor[2];
					const dist = Math.sqrt(dr * dr + dg * dg + db * db);

					if (dist < 150) {
						data[i + 3] = 0;
					}
				}

				ctx.putImageData(imageData, VIDEO_X, VIDEO_Y);
			};

			const draw = () => {
				ctx.clearRect(0, 0, WIDTH, HEIGHT);
				drawVideo();
				requestAnimationFrame(draw);
			};
		</script>
	</body>
</html>
