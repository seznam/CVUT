<!DOCTYPE html>
<html>
	<head>
		<title>
			Notify me!
		</title>
		<meta charset="utf-8">
	</head>
	<body>
		<button>Notify me!</button>

		<script>
			class Geo {
				_loc = null;

				constructor() {
					document.querySelector('button').addEventListener('click', () => {
						this._getLoc();
					});
				}

				// ziska lokaci pouzitim GEO Api
				_getLoc() {
					if ('geolocation' in navigator) {
						navigator.geolocation.getCurrentPosition(this._getLocCallback.bind(this), this._getLocErrorCallback.bind(this));
					}
				}

				// callback pri chybe
				_getLocErrorCallback(e) {
					alert(e.message);
				}

				// callback pri ziskani
				_getLocCallback(pos) {
					console.log("GeolocationPosition", pos);

					this._loc = pos.coords;
					this._notify(this._loc);
				}

				_notify(loc) {
					const txt = 'Pozice úspěšně získána!';

					if (!("Notification" in window)) {
						alert("Nepodporovane API Notification!");
					} else if (Notification.permission === "granted") {
						// mame povoleni - udelame notifikaci
						const notification = new Notification(txt, { icon: 'earth_location.png', lang: 'cs' });
					} else if (Notification.permission !== 'denied') {
						// nemame zeptame se o povoleni
						Notification.requestPermission().then(permission => {
							// ulozime si odpoved uzivatele!
							if (!('permission' in Notification)) {
								Notification.permission = permission;
							}

							// a kdyz mame povoleni udelame notifikaci
							if (permission === "granted") {
								const notification = new Notification(txt, { icon: 'earth_location.png', lang: 'cs' });
							}
						});
					}
				}
			}

			new Geo();
		</script>
	</body>
</html>
